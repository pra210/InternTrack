<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{% block title %}InternTrack{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #1e293b; background: #f8fafc; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
        main { width: min(540px, 100%); padding: 44px; border: 1px solid #e2e8f0; border-radius: 22px; background: white; box-shadow: 0 18px 48px rgb(23 37 84 / 8%); }
        .brand { color: #172554; font-size: 19px; font-weight: 800; letter-spacing: -.7px; }
        .brand span { color: #2563eb; }
        .code { margin: 36px 0 5px; color: #2563eb; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
        h1 { margin: 0 0 12px; color: #172554; font-size: clamp(28px, 6vw, 40px); letter-spacing: -1.3px; }
        p { margin: 0; color: #64748b; font-size: 15px; line-height: 1.7; }
        a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 26px; padding: 0 18px; border-radius: 11px; background: #2563eb; color: white; font-size: 13px; font-weight: 700; text-decoration: none; }
        a:hover { background: #1d4ed8; }
        @media (max-width: 480px) { main { padding: 30px 24px; } }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/">intern<span>track</span></a>
        {% block error_content %}{% endblock %}
    </main>
</body>
</html>
