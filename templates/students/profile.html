{% extends "base.html" %}

{% block title %}Student Profile | InternTrack{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container profile-shell">
        <div class="page-header">
            <div>
                <span class="eyebrow eyebrow-blue">Your profile</span>
                <h1>Update your student profile</h1>
            </div>
            <a href="{% url 'dashboard:student_dashboard' %}" class="button button-small button-primary">Back to dashboard</a>
        </div>

        <div class="profile-card">
            <form method="post" enctype="multipart/form-data" class="auth-form profile-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="button button-primary">Save profile</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
