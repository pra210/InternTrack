{% extends "companies/base.html" %}

{% block title %}Edit Company Profile | InternTrack{% endblock %}

{% block company_content %}
<div class="company-page-heading">
    <div><span class="eyebrow eyebrow-blue">Company information</span><h1>Edit your profile</h1><p>Update your details and help candidates learn about your team.</p></div>
</div>
<section class="company-panel company-form-panel">
    <form method="post" enctype="multipart/form-data" class="auth-form company-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions"><a class="button button-outline" href="{% url 'companies:profile' %}">Cancel</a><button type="submit" class="button button-primary">Save profile</button></div>
    </form>
</section>
{% endblock %}
