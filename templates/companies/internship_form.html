{% extends "companies/base.html" %}

{% block title %}{{ page_title }} | InternTrack{% endblock %}

{% block company_content %}
<div class="company-page-heading">
    <div><span class="eyebrow eyebrow-blue">Hiring</span><h1>{{ page_title }}</h1><p>Share the role details and set the application status.</p></div>
</div>
<section class="company-panel company-form-panel">
    <form method="post" class="auth-form company-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions"><a class="button button-outline" href="{% url 'companies:internship_list' %}">Cancel</a><button type="submit" class="button button-primary">Save internship</button></div>
    </form>
</section>
{% endblock %}
